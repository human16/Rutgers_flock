[project]
name = "rutgers-place-rhetoric-scraper"
version = "0.1.0"
description = "Polite archival web scraper and text-ingestion pipeline for Rutgers University Digital Humanities place-based rhetoric analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "pypdf>=4.2.0",
    "pymupdf>=1.24.0",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

